services:
  - type: web
    name: msp-water-report
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Locks the Settings page so the public can't change your branding/uploads.
      # Render will ask you to enter a value when you deploy.
      - key: ADMIN_PIN
        sync: false
      # Signs flash messages. Render generates a random value automatically.
      - key: SECRET_KEY
        generateValue: true
